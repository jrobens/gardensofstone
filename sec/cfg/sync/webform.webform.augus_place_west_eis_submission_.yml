        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">This area is of great importance to the Wiradjuri People. It&#39;s a significant cultural landscape and has many sites with artefacts including art engravings and pigmentations, carved and scarred trees, stone arrangements and grinding grooves.</p>

        <p dir="ltr">Subsidence from the project threatens 13,000 year-old Aboriginal cultural sites.</p>
    submission_first_nations_rock_art:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Describe the destruction of First Nation''s rock art risks by the Angus Place West proposal'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  issue_contamination:
    '#type': webform_wizard_page
    '#title': 'Contamination of drinking water in Sydney’s Warragamba dam'
    '#states':
      visible:
        ':input[name="contamination_of_drinking_water_in_sydney_s_warragamba_dam_check"]':
          checked: true
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    title_drinking_water:
      '#type': webform_computed_token
      '#title': title
      '#title_display': none
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_05:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">In combination with groundwater impacts from the Springvale mine, the proposal will likely continue to reduce water flows and compromise &nbsp;water quality of the Coxs River which is part of Sydney&rsquo;s main drinking water supply at Warragamba dam.&nbsp;</p>

        <p dir="ltr">Centennial&rsquo;s Angus Place West proposal risks polluting waterways from runoff of dirty water from the coal processing area and discharges from sediment ponds. &nbsp;Leaks from its toxic mine water transfer&nbsp;pipelines to Mount Piper Power Station could also impact the Coxs River.&nbsp;</p>

        <p>Centennial&rsquo;s track record when it comes to water contamination is also of significant concern. In 2017, Centennial was prosecuted for causing toxic coal sludge to spill into the Wollangambe River, which leads into the World Heritage listed Blue Mountains. The major spill was the result of Centennial&rsquo;s Clarence Colliery failure to contain a slurry of water and coal particles into the Wollangambe. Fine coal particles affected a 10-kilometre stretch of the river, turning the water black and coating the streambed in black mud. The cleanup of the World Heritage Area 12 months.</p>
    submission_contamination_drinking_water:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Describe how the Angus Place West proposal risks contaminating drinking water. '
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  long_term_impacts_for_the_local_economy:
    '#type': webform_wizard_page
    '#title': 'Long-term impacts for the local economy'
    '#states':
      visible:
        ':input[name="long_term_impacts_for_the_local_economy_check"]':
          checked: true
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    title_economy:
      '#type': webform_computed_token
      '#title': title
      '#title_display': none
      '#wrapper_attributes':
        class:
          - wizard-page-title
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_06:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">In 2021, &#39;Destination Pagoda Economic Report&rsquo; demonstrated how the unique beauty found in the Gardens of Stone could bring $40 million and 258 jobs to the Lithgow region.&nbsp;</p>

        <p dir="ltr">Around the world, coal fired power plants and mines are closing fast, and good governments manage the restructure of such regional economies by creating economic opportunities and certainty for these communities. The Gardens of Stone are part of the long-term vision for nature-focused ecotourism in Lithgow.&nbsp;</p>

        <p dir="ltr">Centennial&rsquo;s rush to squeeze remaining profits from the area&#39;s dwindling, more difficult to access coal resource is being replaced by solar, wind and pumped hydro. Centennial&#39;s past record suggests damage at Angus Place West could damage important tourism resources and its economic future.</p>
    submission_long_term_impacts_economy:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Describe how the Angus Place West proposal risks the long term viability of the local economy.'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  centennial_s_track_record_of_environmental_damage:
    '#type': webform_wizard_page
    '#title': 'Centennial’s track record of environmental damage'
    '#states':
      visible:
        ':input[name="centennial_s_track_record_of_environmental_damage_check"]':
          checked: true
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    title_track_record:
      '#type': webform_computed_token
      '#title': title
      '#title_display': none
      '#wrapper_attributes':
        class:
          - wizard-page-title
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_07:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">Centennial has failed to demonstrate that it can operate responsibly in the Gardens of Stone region without causing irreversible damage to the environment. Records of environmental incidents and harm, consent and licence non-compliances and inaccurate predictions of environmental impacts from its operations suggest that current impact predictions in the environmental assessment should not be relied upon.</p>

        <p dir="ltr">An audit of Centennial&rsquo;s mining licences for the past five years has found at least 134 licence non-compliances across its sites in the Gardens of Stone region. These include:</p>

        <p dir="ltr">In 2022, Centennial breached its development consent for Airly mine causing major irreversible fractures to million-year-old sandstone pagoda formations in the Mugii Murum-ban State Conservation Area. The Department of Planning and Environment imposed a $150,000 enforceable undertaking on Centennial.&nbsp;</p>

        <p dir="ltr">In 2017, the EPA prosecuted Centennial after its waste water dam at Clarence mine spilt 2330 tonnes of toxic coal slurry into the Wollangambe River and caused damage within the Blue Mountains National Park, Centennial was fined over $1 million and clean-up operations took 12 months.</p>

        <p dir="ltr">In 2015, Centennial was fined $15,000 when toxic coal sludge was illegally discharged from Springvale mine sediment storage ponds into downstream wetlands.</p>

        <p dir="ltr">In 2011, Centennial acknowledged that the Federal Environment Minister considered its mining activities had had a significant impact on Temperate Highland Peat Swamps on Sandstone, namely Narrow Swamp, East Wolgan Swamp and Junction Swamp and entered a $1.45 million enforceable undertaking with the Commonwealth under s 486DA of the EPBC Act. These swamps have not recovered and are expected to be permanently lost.</p>
    submission_centennial_track_record:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Describe how Centennial coal isn''t a fit custodian/protector of our natural resources'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  climate_pollution:
    '#type': webform_wizard_page
    '#title': 'Climate pollution'
    '#states':
      visible:
        ':input[name="climate_pollution_check"]':
          checked: true
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    title_climate_pollution:
      '#type': webform_computed_token
      '#title': title
      '#title_display': none
      '#wrapper_attributes':
        class:
          - wizard-page-title
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_08:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">With a proposed extraction rate of 2 million tonnes per year, Centennial is seeking consent to potentially mine up to a total of 38 million tonnes of coal. Again, Centennial&rsquo;s predictions are untrustworthy. In 2020, investigations by the Nature Conservation Council revealed that the company was cheating on its greenhouse emissions assessment &ndash; it failed to account for 97% of the climate pollution it would cause.&nbsp;&nbsp;</p>

        <p dir="ltr">When burned, this will contribute to climate change. Disasters like the Black Summer Bushfires, which will only increase in intensity, will again be felt in the Gardens of Stone region. The loss of tree canopy will then be added to the legacy of mining and ruin the world-class tourism and conservation reserve on Lithgow&#39;s doorstep.&nbsp;</p>
    submission_climate_pollution:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Describe how the Angus Place West proposal will cause undue climate pollution.'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
