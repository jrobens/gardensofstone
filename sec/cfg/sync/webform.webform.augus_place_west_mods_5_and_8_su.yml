      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">If the capacity of the 40ML/day Springvale Water Treatment Plant has been exceed and cannot treat an additional 10ML/day of mine water from Angus Place Mine as proposed in modification 8, then an additional water treatment plant is required.&nbsp;<span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">This is a large amount of additional mine water and the entire Angus Place and Springvale mine water matter requires thorough scrutiny </span></span></span></span>by expert panels, including the Independent Expert Scientific Committee on Coal Seam Gas and Large Coal Mining Development, the NSW Independent Planning Commission and the Independent Expert Advisory Panel on Underground Mining.&nbsp;<br />
        &nbsp;</p>

        <p>Centennial Coal should withdraw modification 8 Angus Place and 5 Western Coal Services. Centennial Coal should at least seek to install a reverse osmosis treatment plant at Angus Place, as it did under modification 5, and then pump the brine effluent to Springvale Water Treatment Plant site for processing and appropriate disposal.</p>

        <p>Any proposal for additional water treatment capacity at Angus Place Mine should be made as part of the major project for Angus Place West. Dischages from a reverse osmosis treatment plant at Angus Place should have a salinity of 30&mu;S/cm to have a neutral effect on the salinity of the Coxs River headwaters that would receive this discharge.&nbsp;</p>
    submission_climate_pollution:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Do you think Angus Place and Western Coal Services modification proposals may cause undue mine water pollution in Wangcol Creek and the Coxs River? If so, then what additional water treatment plant is necessary to protect the Coxs River and do you think the modification can proceed without such additional treatment?'
      '#access_create_roles':
