        '#markup': |-
          <p dir="ltr">Start by introducing yourself and explaining why you care about this proposal.</p>

          <p dir="ltr">You could describe your connection to the Gardens of Stone conservation area and any concerns you have about mining underneath in the reserve. Or you might want to include concerns that you may have for <span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">mine water discharges polluting Sydney&rsquo;s drinking water supplies</span></span></span></span>.</p>

          <p dir="ltr">For example:&nbsp;</p>

          <p dir="ltr"><em>To whom it may concern,</em></p>

          <p dir="ltr"><em>I have lived in the Lithgow area for 30 years and have travelled extensively throughout the Gardens of Stone conservation area. I feel a deep affinity with the natural beauty of the place. I wish that this beauty be appreciated by generations to come.<br />
          <br />
          Each time I see these beautiful pagodas, streams, waterfalls and swamps damaged I feel as though I have been personally injured. I appreciate it when my children wonder at how the rock formations look like a particular bird, boat or boot and feel that it is very short sighted to damage this reserve for short term profit.</em><br />
          <br />
          Or perhaps you are concerned about water</p>

          <p dir="ltr"><em>I am a parent who enjoys taking my kids exploring in the Gardens of Stone State Conservation Area on weekends. I am worried about what this project might mean for the health of the Coxs River and this beautiful environment. My kids love the Gardens of Stone but I&rsquo;m concerned that this mining project will have a long term impact on the environment and that mine water could pollute Sydney&#39;s drinking water supplies into the future.</em></p>
