        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p><strong>Make an objection to commercial lease in Gardens of Stone State Conservation Area</strong><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">When the Gardens of Stone State Conservation Area was announced on November 13, 2021, the NSW Government also announced exclusive resort accommodation in association with a Great Walk and an adventure theme park at Lost City.</span></span></span><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">Two leases over this conservation reserve in connection with these developments are being advertised over the holiday period until January 18. The parent company involved with these proposals is Experience Co (this is the same company that has plans to develop the Tasmanian Wilderness World Heritage Area).</span></span></span><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">Object to these leases that seek would privatise parts of this conservation reserve before the public has an opportunity to comment on the details of these developments. Cynically ticking the consultation box without information is a sham process.&nbsp;<a href="https://www.environment.nsw.gov.au/topics/parks-reserves-and-protected-areas/park-management/community-engagement/walking-tracks-and-trails-in-national-parks/gardens-of-stone-state-conservation-area/gardens-of-stone-state-conservation-area-leases">Very limited information is available in the public exhibition of the notice to grant leases.</a></span></span></span><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">Express your concerns about the development threat to this important Blue Mountains reserve <strong>before cob, January 18</strong>. </span></span></span><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">Please make an objection by either going to the <a href="https://www.environment.nsw.gov.au/topics/parks-reserves-and-protected-areas/park-management/community-engagement/walking-tracks-and-trails-in-national-parks/gardens-of-stone-state-conservation-area/gardens-of-stone-state-conservation-area-leases">NSW Government&#39;s comments page</a> or you can modify the guide submission in the webform below:</span></span></span></p>
    submission:
      '#type': fieldset
      '#title': 'Objection to the granting of Gardens of Stone leases'
      '#title_display': invisible
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      plan_of_management_submission:
        '#type': textarea
        '#title': 'Submission on lease developments'
        '#rows': 40
        '#required': true
        '#default_value': |-
          Manager
          Property and Lease Management Unit
          Locked Bag 5022
          Parramatta NSW 2124

          To whom it may concern,

          I object to the NSW Government announcing an intention to issue leases over the Gardens of Stone State Conservation Area before specific details are made available regarding the four accommodation resorts and the Lost City adventure theme park.

          I object to a lease being issued to Wild Bush Luxury because the four proposed accommodation resorts will adversely impact the cultural and natural heritage of the Gardens of Stone State Conservation Area. I object to this company being given exclusive possession of this conservation reserve before its development proposal has been subject to public comment and review.

          The lease is for multi-day walk accommodation caters to high-paying guests. The impacts on the reserve of the four proposed resorts will be relatively large relative to the accommodation benefits gained by a small elite group. I object to the exclusive monopoly use of remote parts of the Gardens of Stone State Conservation Area where impacts from this kind tourism are greatest. This poor tourism model also siphons off the highest paying tourists who might otherwise spend their money in the local community.

          I also object to a lease being issued to Trees Adventure Holdings over the Lost City Precinct for an adventure theme park. Ziplines, toilets, carparks, elevated walkways/suspension bridges, via ferrata climbs and possibly a food outlet will cause visual blight to Lithgow’s most scenic pagoda landscape. The natural beauty of Lost City in the Gardens of Stone State Conservation Area should not be spoiled to provide amusement rides. The Lost City location may also put children at risk as it adjoins the Marrangaroo Military Base that uses live ammunition and ordinance.

          The marketing value of the Lost City for Trees Adventure Holdings is its naturalness, but natural beauty of this area will be further degraded by this development and the local community will lose its chance to establish a scenic lookout as good as that at Echo Point, Katoomba.

          I further object to the Lost City location for an adventure park as most visitors will not go to Lithgow but enter the reserve from Clarence via the Old Bells Line of Road so that the local community will gain little benefit from this proposed development.

          Given the lack of information, I request that the Minister for the Environment convene a public hearing on both these leases that are proposed to be issued to subsidiary companies of Experience Co. A public hearing should remedy the serious defects in the lease issuing process that has kept almost all details of these proposals secret. The public hearing process should give the public access to details on what is proposed at the accommodation resort sites and adventure park, as well as information about the impacts to heritage values of the planned development under these leases, and permit any person to make an informed contribution at the hearing regarding these leases.

          Thank you for the opportunity to comment.

          Sincerely,
