        '#markup': |-
          <p><strong>Angus Place West coal mine extension proposal</strong></p>

          <p dir="ltr">Have your say on Centennial&rsquo;s latest plans to mine under unique wetlands and ancient rock formations - putting new areas of the Gardens of Stone conservation reserve at risk of damage. We&#39;ve included information below to help guide you through the process of making a submission on the Angus Place West.&nbsp;<strong>SSD-26254212</strong></p>

          <h2 dir="ltr"><a href="https://majorprojects.planningportal.nsw.gov.au/prweb/PRRestService/mp/01/getContent?AttachRef=PDA-24963134%2120210816T055101.879%20GMT">View Centennial Coal&#39;s scoping report</a></h2>

          <h2 dir="ltr"><a href="https://www.gardensofstone.org.au/placeholder-submission-guide-object-angus-place-west-coal-mine-extension" target="_blank">View the issues</a></h2>

          <p dir="ltr">To help trigger an Independent Planning Commission assessment, your submission needs to be a unique contribution that highlights concerns important to you in your own words. Submissions are required to be &ldquo;substantially different&rdquo;. They must be written differently; not copied and pasted multiple times.&nbsp;And 50 unique submissions are required to trigger an enquiry, so make yours count.&nbsp;<br />
          Object before DAY MONTH, to &nbsp;ensure a Planning Commission hearing so that the Angus Place West proposal receives thorough scrutiny and as much community involvement in &nbsp;decision making as possible.<br />
          If you have questions or need help to guide you through this process contact Keith Muir <a href="http://mailto:keith.muir6@bigpond.com">http://mailto:keith.muir6@bigpond.com</a>&nbsp;</p>

          <h3 dir="ltr">Making a submission</h3>

          <p style="line-height:1.38; background-color:#ffffff"><span style="font-size:12pt; font-variant:normal; white-space:pre-wrap"><span style="font-family:Merriweather,serif"><span style="color:#000000"><span style="font-weight:400"><span style="font-style:normal"><span style="text-decoration:none">To write your submission, you can draft it directly into the text box on the following pages. Alternatively you may like to draft into a blank word document and copy your answers across, to ensure you don&rsquo;t lose anything.&nbsp;</span></span></span></span></span></span></p>

          <p dir="ltr">The Gardens of Stone Alliance has identified the issues below; you can raise one, some or all of these in your submission.&nbsp;</p>

          <p dir="ltr"><strong>Remember, to count as one of the 50 required written objections your concerns&nbsp;must be written in your own words.</strong>&nbsp;<br />
          <br />
          The Department does not count identical or substantially the same submissions as separate objections.&nbsp;<br />
          A submission consists of&nbsp;</p>

          <ol dir="ltr">
          	<li>Political donations declaration</li>
          	<li>Personal details</li>
          	<li>Declaration that this is an objection</li>
          	<li>Submission overview</li>
          	<li>Address the issues</li>
          </ol>

          <p dir="ltr">The following are the major issues identified by the Gardens of Stone Committee.The major issues as You may have a different set of issues, please feel free to adapt this list in your submission.&nbsp;<br />
          Which issues would you like to include in your submission?</p>
