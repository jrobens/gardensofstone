      '#title_display': none
      '#wrapper_attributes':
        class:
          - wizard-page-title
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_10:
      '#type': webform_markup
      '#markup': '<p>To improve transparency of the planning system, NSW laws require that when you are making a submission on a development proposal you must disclose any gifts or reportable political donations that you have made to a political party, elected member, group, candidate associated entity or third party campaigner in the two years prior to making your submission (includes Nature Conservation Council of NSW).</p><p>Reportable political donations are donations of $1,000 or more (or smaller donations totaling $1,000 or more within the same financial year). A gift includes a gift of money or the provision of any other valuable thing or service for no money or inadequate money in return. If you think this might apply to you, please read the NSW Department of Planning’s information on reportable political donations before proceeding.</p><ul><li data-list-item-id="e4e0bba8e22a54c8997a1fc3da84eaa48">If <strong>NO</strong>, continue to rest of form</li><li data-list-item-id="ef118b2dedd5a3e85de43bb7d2f1ca7d8">If <strong>YES.&nbsp;</strong>Please make your submission through the <a href="https://www.planningportal.nsw.gov.au/major-projects/projects/mod-4-temporary-changes-helicopter-transport">NSW Government’s Major Projects Portal</a> so that you can disclose your political donation. You can still use our FAQs to help with your submission.</li></ul><p>Thank you for helping ensure communities get a proper say on this massive increase in helicopter flights over the Gardens of Stone region!</p>'
    radio_button_yes_no_political_donations:
      '#type': radios
      '#title': 'Have you made a reportable political donation?'
      '#description_display': before
      '#options': yes_no
      '#options_display': buttons
