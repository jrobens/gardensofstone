      '#markup': |-
        <p dir="ltr">The Gardens of Stone are diverse landscape of globally significant geological heritage. The proposed Angus Place West mine expansion threatens the sandstone pagodas and cliffs, canyons and steep gullies that make the Gardens of Stone unique.</p>

        <p dir="ltr">In the areas above Centennial&rsquo;s existing mines, land subsidence has already resulted in hundreds of cliff falls and widespread surface cracking. Centennial is always getting its subsidence predictions wrong and causing damage.&nbsp;</p>

        <p dir="ltr">Last year Centennial was found responsible for causing irreversible fractures to a million-year-old sandstone formation in the Mugii Murum-ban State Conservation Area, in breach of its Airly mine consent</p>
