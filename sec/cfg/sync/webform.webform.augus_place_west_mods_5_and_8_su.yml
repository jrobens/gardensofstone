        '#markup': |-
          <p><strong>Angus Place Mine and Western Coal Services modification proposals</strong></p>

          <p dir="ltr"><span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#363636">Have your say on Centennial&rsquo;s latest plans </span><span style="color:#1b1b1b">to prepare for future mining under unique wetlands and ancient rock formations that put areas of the Gardens of Stone conservation reserve at risk of damage.&nbsp;Centennial&#39;s mine proposals also include plans to recommence discharges of mine water to the Coxs River catchment, part of Sydney&#39;s water catchment.</span></span></span></span></span><br />
          <br />
          <span style="font-size:11pt"><span style="background:white"><span style="line-height:normal"><span style="font-family:Calibri,sans-serif"><span lang="EN-AU" style="font-size:12.0pt"><span style="color:#363636">We&#39;ve included information below to help guide you through the process of making a submission on these plans.</span></span></span></span></span></span><br />
          <br />
          <span style="font-size:11pt"><span style="background:white"><span style="line-height:normal"><span style="font-family:Calibri,sans-serif"><span lang="EN-AU" style="font-size:12.0pt"><span style="color:#363636">Centennial&rsquo;s plans require modifications to two consents, modification 5 deals with Angus Place Mine&rsquo;s consent (MP06_0021) and modification 8 to Western Coal Services consent (SSD-5579).<br />
          <br />
          But you can address both of these in one submission.</span></span></span></span></span></span></p>

          <h2 dir="ltr"><a href="https://majorprojects.planningportal.nsw.gov.au/prweb/PRRestService/mp/01/getContent?AttachRef=SSD-5579-MOD-5%2120230925T005143.800%20GMT">View Centennial Coal&#39;s report on the proposed modifications</a></h2>

          <h2 dir="ltr"><a href="/centennial-coals-latest-mining-proposals-gardens-stone">View the issues and a simple text-based submission guide for those who don&#39;t want to use the submission form</a></h2>

          <p>Your submission will have the most effect if you personalise your submission by introducing yourself and state your concerns in your own words.<br />
          <br />
          <strong>Make a submission before 11.59pm Thursday October 12, 2023</strong> and call for greater scrutiny of the proposals, including by the Federal Government, the&nbsp;Independent Expert Scientific Committee&nbsp;on Coal Seam Gas and Large Coal Mining Development, the NSW Independent&nbsp;Planning Commission and the&nbsp;Independent Expert Advisory Panel on underground mining so that these modification proposals receive thorough scrutiny and as much community involvement in decision making as possible.</p>

          <p dir="ltr">If you have questions or need help to guide you through this process contact Keith Muir&nbsp;<a href="http://mailto:keith.muir6@bigpond.com">keith.muir6@bigpond.com</a>&nbsp;<br />
          &nbsp;</p>

          <h3 dir="ltr">Make a submission</h3>

          <p style="line-height:1.38; background-color:#ffffff"><span style="font-size:12pt; font-variant:normal; white-space:pre-wrap"><span style="font-family:Merriweather,serif"><span style="color:#000000"><span style="font-weight:400"><span style="font-style:normal"><span style="text-decoration:none"><strong>Option 1 (preferred)</strong>: Draft a submission into a blank Word document and copy your answers across to the <a href="https://www.planningportal.nsw.gov.au/major-projects/projects/mod-8-water-transfer-western-coal-services">NSW Planning website</a> to ensure you don&#39;t lose anything.&nbsp;Please use this approach if you have made a reportable political donation in the last two years over $1,000 (this includes conservation groups like the NCC). </span></span></span></span></span></span><span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">This option is more direct, but it does require you to create a login for the NSW Planning Major Project portal. Our&nbsp;</span></span></span></span><span style="font-size:12pt; font-variant:normal; white-space:pre-wrap"><span style="font-family:Merriweather,serif"><span style="color:#000000"><span style="font-weight:400"><span style="font-style:normal"><span style="text-decoration:none"><a href="/centennial-coals-latest-mining-proposals-gardens-stone">submission guide</a> can assist you with your submission. </span></span></span></span></span></span><br />
          <br />
          <span style="font-size:12pt; font-variant:normal; white-space:pre-wrap"><span style="font-family:Merriweather,serif"><span style="color:#000000"><span style="font-weight:400"><span style="font-style:normal"><span style="text-decoration:none"><strong>Option 2</strong>: Use our form for step-by-step guidance to create your submission. You can draft directly into the text boxes on the following pages and the form compiles your submission as you go. Start at the bottom of this page by selecting the issues you&#39;re concerned about and then click next.</span></span></span></span></span></span></p>

          <p dir="ltr">The Department does not count identicant or substantially the same submissions as spearate objections, so plase take the time to write these concerns in your own words.</p>

          <p dir="ltr">Our step-by-step form will take you through:&nbsp;</p>

          <ol dir="ltr">
          	<li>Information about political donations and withholding your name</li>
          	<li>Entering your personal details</li>
          	<li>Writing a personal introduction for your submission</li>
          	<li>Commenting on each of the issues you select below.</li>
          </ol>

          <h3 dir="ltr">Key concerns to raise in your submission</h3>

          <p dir="ltr"><span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">The Gardens of Stone Alliance has identified the issues below; you can raise one, some or all of these in your submission. You may have additional concerns and we&#39;d encourage you to include these in your submission, either via the planning website or by using the &#39;other&#39; checkbox below.&nbsp;</span></span></span></span></span><br />
          <br />
          Which concerns would you like to include in your submission? (Simply uncheck issues you <strong>don&#39;t </strong>wish comment on).</p>
