      '#markup': |-
        <p>To improve transparency of the planning system, NSW laws require that when you are making a submission on a development proposal you must disclose any gifts or reportable political donations that you have made to a political party, elected member, group, candidate associated entity or third party campaigner in the two years prior to making your submission (includes Nature Conservation Council of NSW).<br />
        Reportable political donations are donations of $1,000 or more (or smaller donations totaling $1,000 or more within the same financial year). A gift includes a gift of money or the provision of any other valuable thing or service for no money or inadequate money in return. If you think this might apply to you, please read the NSW Department of Planning&rsquo;s information on reportable political donations before proceeding.</p>

        <ul>
        	<li>If <strong>NO</strong>, continue to rest of form</li>
        	<li>If <strong>YES.&nbsp;</strong>Please make your submission through the <a href="https://www.planningportal.nsw.gov.au/major-projects/projects/angus-place-west">NSW Government&rsquo;s Major Projects Portal</a> so that you can disclose your political donation. You can still use our FAQs to help with your submission.</li>
        </ul>

        <p>Thank you for helping ensure communities get a proper say on Centennial&rsquo;s plans!</p>
