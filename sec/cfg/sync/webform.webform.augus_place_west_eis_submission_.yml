      '#markup': |-
        <p dir="ltr">Subsidence and the resulting damage to nationally significant wetlands is a major risk of the latest proposal &ndash; especially given Centennial&rsquo;s long record of destroying endangered wetlands, and its failure to predict swamp damage arising from its mining operations. &nbsp;</p>

        <p dir="ltr">Land subsidence associated with underground coal mining in this area has already drained of headwater streams, caused harmful changes to the chemistry of surface water, and irreversibly damaged nationally significant and endangered swampland.&nbsp;</p>

        <p dir="ltr">The environmental offset payments by Centennial are a classic example of how national heritage protection&nbsp;for swamps is by-passed by the coal industry.</p>

        <p dir="ltr">In 2011 Centennial acknowledged that the Federal Environment Minister considered its mining activities had had a significant impact on Temperate Highland Peat Swamps on Sandstone, namely Narrow Swamp, East Wolgan Swamp and Junction Swamp and entered a $1.45 million enforceable undertaking with the Commonwealth. These beautiful swamps are permanently lost.</p>

        <p dir="ltr">If the proposed Angus Place West expansion is approved, groundwater drawdown from subsidence could cause irreversible damage to Long Swamp and other endangered wetlands located along Lambs and Kangaroo Creek. These wetlands support dozens of threatened species. In total, the project area contains at least 10 federally listed threatened species and ecological communities and 17 NSW-listed threatened species.</p>

        <p dir="ltr">Parts of the proposed mining areas reach directly beneath Lambs and Kangaroo Creeks at concerningly shallow depths of between 43m and 270m. The health and integrity of these creeks are critical for supporting the endangered &lsquo;Newnes Plateau Shrub Swamp&rsquo; and a number of nationally threatened species and endangered ecological communities (EEC), including Temperate Highland Peat Swamps on Sandstone which are located along the creek line.&nbsp;&nbsp;</p>

        <p dir="ltr">If the proposed Angus Place West expansion is approved, groundwater drawdown from subsidence could cause irreversible damage to Long Swamp and other endangered wetlands located along Lambs and Kangaroo Creek. These wetlands support dozens of threatened species. In total, the project area is home to at least 10 federally listed threatened species and ecological communities and 17 NSW-listed threatened species.&nbsp;</p>
    submission_destruction_unique_wetlands:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Describe why the Angus Place West proposal will damage wetlands and why this is a bad thing.'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  destruction_of_historic_first_nation_s_rock_art:
    '#type': webform_wizard_page
    '#title': 'Destruction of historic First Nation’s rock art'
    '#states':
      visible:
        ':input[name="destruction_of_historic_first_nation_s_rock_art_check"]':
          checked: true
    '#access_create_roles':
