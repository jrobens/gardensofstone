  confirmation_message: '<p>Your submission to:</p><p>The <span style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-family:Aptos, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Gardens of Stone State Conservation Area Project Team</span> of the NSW National Parks and Wildlife Service; and to&nbsp;</p><p>Mr Brett Mitchell, Managing Director of Intrepid Travel, Australia has been sent.&nbsp;</p><p>&nbsp;</p><p>An email record of your submissions has been sent to you.</p><p>Thank you for your help in seeking protection for the iconic plates pagoda landscapes of the Gardens of Stone State Conservation Area from the blight that would be caused by placing commercial glamping resorts in them.</p><p>Sincerely,</p><p>Keith Muir<br>Hon. Projects Officer<br>Wilderness Australia</p>'
