      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_07:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">Centennial has failed to demonstrate that it can operate responsibly in the Gardens of Stone region without causing irreversible damage to the environment. Records of environmental incidents and harm, consent and licence non-compliances and inaccurate predictions of environmental impacts from its operations suggest that current impact predictions in the environmental assessment should not be relied upon.</p>

        <p dir="ltr">An audit of Centennial&rsquo;s mining licences for the past five years has found at least 134 licence non-compliances across its sites in the Gardens of Stone region. Centennial&#39;s non-compliance events in the region include:</p>

        <p dir="ltr">&bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;In 2022, Centennial breached its development consent for Airly mine causing major irreversible fractures to million-year-old sandstone pagoda formations in the Mugii Murum-ban State Conservation Area. The Department of Planning and Environment imposed a $150,000 enforceable undertaking on Centennial. The company has since mined outside its approved area at Airly Mine, a Class 1 reportable offence <span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">under NSW <em>Environmental Planning and Assessment Act</em></span></span></span></span>.</p>

        <p dir="ltr">&bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;In 2017, the EPA prosecuted Centennial after its coal waste storage at Clarence mine spilt 2330 tonnes of coal fines into the Wollangambe River and caused damage within the Blue Mountains World Heritage Area,&nbsp; and Centennial was fined over $1 million and clean-up operations took 12 months.</p>

        <p dir="ltr">&bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;In 2015, Centennial was fined $15,000 when toxic coal sludge was illegally discharged from Springvale mine sediment storage ponds into downstream wetlands.</p>

        <p dir="ltr">&bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;In 2011, Centennial acknowledged that the Federal Environment Minister considered its mining activities had had a significant impact on Temperate Highland Peat Swamps on Sandstone, namely Narrow Swamp, East Wolgan Swamp and Junction Swamp and entered a $1.45 million enforceable undertaking with the Commonwealth under s 486DA of the EPBC Act. These swamps have not recovered and are expected to be permanently lost. The company has since paid $28 million that only partly offsets some of the significant damage it has caused to nationally endangered swamps on Newnes Plateau.</p>
    submission_centennial_track_record:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Given its track record, do you believe Centennial Coal is a fit custodian/protector of our natural resources to give you confidence to rely on report on the proposed modificaitons?'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
