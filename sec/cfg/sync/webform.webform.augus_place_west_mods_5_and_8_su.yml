    markup_03:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr"><span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">In 2018, Angus Place Mine Modification 5 was approved allowing pumping at a rate of 10 ML/day from mine workings (areas 800 and 900). Following this approval, the groundwater table dropped between 21 and 30 metres (Centennial Coal, Coxs River Swamp Review, July 2018, pg44). This drop in groundwater was observed to quickly dry out Kangaroo and Lambs Creeks and associated swamps, as well as the Coxs River and swamps (</span></span></span></span></span>Lithgow Environment Group, pers. comm. 4 Oct, 2023)<span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">. </span></span></span></span></span><br />
        <br />
        Since 2018, far-field loss of surface waters in Newnes Plateau streams and swamps have been observed&nbsp;over a kilometre away&nbsp;following depressurisation of groundwater in a coal seam due to coal mining at Springvale. Such far-field impacts may explain the observations made by Lithgow Environment Centre in 2018 and why future surface water losses from dewatering areas 800 and 900 may be expected.<br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">The proposed modification 8 which would allow pumping at 10ML/day from areas 800 and 900 is likely to again lower the groundwater table and also impact on surface water resrouces of the area of operations for the Angus Place West proposal.</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="box-sizing:inherit"><span style="font-variant-ligatures:normal"><span style="text-decoration-thickness:initial"><span style="text-decoration-style:initial"><span style="text-decoration-color:initial"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="box-sizing:inherit"><span style="font-style:inherit"><span style="font-weight:inherit"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">Due to the proximity of the Lithgow Coal seam to the surface in the Angus Place West project area. These modifications may cause regional drawdown or localised far-field drawdown of near-surface groundwater, damaging Kangaroo and Lambs Creeks and swamps, as well as the upper Coxs River and its swamps.</span></span> Nationally endangered plants may also be harmed, including <em>Xerochrysum palustre</em> (Swamp everlasting), <em>Pultenaea glabra</em>, <em>Kunzea cambagei</em>, <em>Veronica blakleyi</em>, <em>Grevillea acanthifolia</em>, <em>Gentianella cunninghamii</em>, <em>Prasophyllum australe</em> and Latham&#39;s Snipe (a rare migratory bird species).</span></span></span></span></span></span></span></span></span></span></span></p>
    submission_destruction_unique_wetlands:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Do you think the Angus Place modification 8 proposal will damage wetlands and why this is a bad thing?'
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  issue_contamination:
    '#type': webform_wizard_page
    '#title': 'Contamination of Sydney''s drinking water resources'
    '#states':
      visible:
        ':input[name="contamination_of_drinking_water_in_sydney_s_warragamba_dam_check"]':
          checked: true
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    title_drinking_water:
      '#type': webform_computed_token
      '#title': title
      '#title_display': none
      '#wrapper_attributes':
        class:
          - wizard-page-title
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_05:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr">The mine effluent will have elevated levels of heavy metals if salinity is treated to the proposed 350&mu;S/cm standard. This level of treatment may not adequately protect aquatic ecosystems, especially macroinvertebrates, given the flow of mine water at the LDP001 entry point into Wangcol Creek. Wangcol Creek flows to the Coxs River and is part of Sydney&rsquo;s Drinking Water Catchment. The modifications will see more contaminated mine water going into the Wangcol Creek from the Western Coal Services site. This water is likely to be contaminated with toxic chemicals such as arsenic and selenium that have been recorded as present in the mine water of the Springvale-Angus Place mine water system.<br />
        <br />
        The proposed discharges should not meet the &ldquo;neutral or beneficial&rdquo; test&nbsp; for water pollution because it adds to the overall pollution load in the creek. The transfer of 10ML/day of mine water from Angus Place to the Western Coal Services site for discharge should not be allowed.&nbsp;<br />
        <span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif">Adding mine water to a highly polluted element of the Wangcol Creek catchment is also likely to flush out more heavy metals from that contiminated part of the catchment downstream into the Coxs River, a key part of Sydney&#39;s water catchment that flows through the Greater Blue Mountains World Heritage Area.&nbsp;</span></span></span></p>

        <p dir="ltr"><span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif">These modification proposals to allow large discharges of mine water also defeat the purpose of the $120 million Springvale Water Treatment Project (SSD-7592, approved in June 2017) that was built to eliminate mine water discharges from Springvale Mine and Angus Place Colliery. </span></span></span></p>
    submission_contamination_drinking_water:
      '#type': textarea
      '#title': Submission
      '#placeholder': |-
        Do you believe the Angus Place modification proposal risks contaminating raw drinking water resources of the Coxs River and polluting the World Heritage Area?

        Why do you think that the $120 million treatment plant, that can treat 40ML/day of mine water, is not being used to treat the mine water from Angus Place under modification 8?
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
  long_term_impacts_for_the_local_economy:
    '#type': webform_wizard_page
    '#title': 'These modifications should be assessed under Federal environmental law'
    '#states':
      visible:
        ':input[name="long_term_impacts_for_the_local_economy_check"]':
          checked: true
    '#access_create_roles':
      - authenticated
      - anonymous
