name: Gardens of Stone
description: >-
  Enables the use of Drulma:
  a free, open source CSS framework based on Flexbox.
package: 'Interlated'
type: theme
base theme: drulma
core_version_requirement:  ^10 || ^11
dependencies:
  - drulma:drulma

libraries:
  - gardensofstone/global

libraries-override:
  drulma/global: false
  drulma/bulma: false

regions:
  primary_menu: 'Navbar'
  header: 'Hero Header'
  title: 'Hero body (title)'
  secondary_menu: 'Hero footer (tabs)'
  breadcrumb: 'Breadcrumb'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'Sidebar First'
  sidebar_second: 'Sidebar Second'
  footer: 'Footer'
  subfooter: 'Subfooter'
  footer_editing: 'Footer Editing'
