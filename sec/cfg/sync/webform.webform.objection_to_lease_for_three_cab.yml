id: objection_to_lease_for_three_cab
title: 'Make an objection to lease for three cabin developments in the Gardens of Stone SCA'
description: 'Submission regarding a commercial accommodation lease over the Gardens of Stone State Conservation Area'
categories: {  }
elements: |-
  plan_of_management:
    '#type': webform_wizard_page
    '#title': 'Make an object to commerical lease development located among pagoda rocks/threats'
    markup:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p><strong>Make an objection to commercial cabin development among pagodas in Gardens of Stone State Conservation Area</strong><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">The NSW Government has placed on exhibition for comment a lease notice for exclusive cabin accommodation located among pagoda landforms, causing visual blight. <a href="/news/bid-serviced-cabins-blue-mountains-park-will-test-minns-governments-green-credentials">A media response to the lease notice explains some of the issues</a>.<br />
        <br />
        It is far better to make an unique individual submission, than to use this webform. If you would like to have a go at that, then <a href="/gardens-stone-sca-cabins-lease-dot-point-guide-making-objection">please use this dot guide</a>.<br />
        <br />
        The lease proposal creates an appalling precedent of putting accommodation development in parks on top of visually prominent landscape features.</span></span></span><br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">The proposal also creates two classes of park visitor: the haves who get luxury accommodation, and are waited on; and the have nots who look after themselves. This sort of thing has been fought off our beaches, like Bondi, and now its time to fight it out of our parks.</span></span></span><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><strong>The lease proposal in this conservation reserve is being advertised until June 26</strong>. The parent company involved with these proposals is Experience Co (the company that has plans to develop cabins in the Tasmanian Wilderness World Heritage Area, denying the world its best temperate coastal wilderness).</span></span></span><br />
        <br />
        <span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">Please make an objection by either going to the <a href="https://www.environment.nsw.gov.au/topics/parks-reserves-and-protected-areas/park-management/community-engagement/walking-tracks-and-trails-in-national-parks/gardens-of-stone-state-conservation-area/gardens-of-stone-multi-day-walk-lease">NSW Government&#39;s comments page</a> or you can modify the guide submission in the webform below:</span></span></span></p>
    submission:
      '#type': fieldset
      '#title': 'Objection to the granting of cabin leases among pagodas in the Gardens of Stone '
      '#title_display': invisible
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      plan_of_management_submission:
        '#type': textarea
        '#title': 'Submission as an objection to cabin lease development'
        '#rows': 40
        '#required': true
        '#default_value': |-
          Manager
          Property and Lease Management Unit
          Locked Bag 5022
          Parramatta NSW 2124

          To whom it may concern,

          I object to a lease being issued to Wild Bush Luxury because the proposed cabin accommodation would adversely impact the cultural and natural heritage of three beautiful pagoda landscapes in the Gardens of Stone State Conservation Area. 

          I object to this company being given exclusive possession to create luxury, serviced accommodation that would blight pagoda scenery. The public campgrounds are discretely tucked away, but not so these cabin developments. Three cabin developments in pagoda landscapes are a development over-reach and completely inappropriate.

          The tourist guidelines for parks are supposed to protect pristine areas, but this proposal seeks to develop cabin accommodation within the remote, undisturbed pagoda areas causing damage to the Gardens of Stone. The proposal will set an appalling precedent of prominent highly visual development in a park.

          Experience Co wants to prominently develop cabins in spectacular landscapes so it can then use images of its cabins nestled among stunning pagodas rock formations in its marketing publicity. I strongly object to this a crude form of park privatisation.

          The NSW Government rejected the Lost City adventure park that damaged valuable scenery. Environment Minister Penny Sharpe needs to be consistent and reject this lease proposal that would harm not one, but three pagoda landscapes.

          Thank you for the opportunity to comment.

          Sincerely,
        '#access_create_roles':
          - authenticated
          - anonymous
        '#access_update_roles':
          - authenticated
          - anonymous
        '#access_view_roles':
          - authenticated
          - anonymous
  name_and_address:
    '#type': webform_wizard_page
    '#title': 'Name and Address'
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    email:
      '#type': email
      '#title': Email
      '#required': true
    civicrm_1_contact_1_address_postal_code:
      '#type': textfield
      '#title': 'Post Code'
      '#required': true
      '#extra':
        width: 7
      '#form_key': civicrm_1_contact_1_address_postal_code
      '#parent': civicrm_1_contact_1_fieldset_fieldset
    subscribe_to_our_mailing_list:
      '#type': checkbox
      '#title': 'Subscribe to our mailing list'
