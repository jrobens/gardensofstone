id: emirates_wolgan_valley_resort_mo
title: 'Emirates Wolgan Valley Resort - Modification 4 submission'
description: '<p>Submission on Emirates Wolgan Valley Resort - Modification 4 regarding protential environmental impacts</p>'
categories: {  }
elements: |-
  plan_of_management:
    '#type': webform_wizard_page
    '#title': 'Emirates Wolgan Valley Resort - Mod 4 submission'
    '#open': true
    have_your_say:
      '#type': details
      '#title': 'Have your say'
      '#help_title': "Have your say on Emirates' latest plans for more helicopters"
      '#help': "<p>Have your say on the Emirates' latest plans to proposal for 210 helicopter movements/week (105 in and 105 out) and 30/day to its Wolgan Valley resort. We've included information below to help guide you through the process of making a submission on these helicopter plans to shatter the peace.&nbsp;<strong>MP06_0310, Mod 4</strong></p>"
      '#open': true
      markup:
        '#type': webform_markup
        '#markup': '<p><strong>The proposal for 30 helicopters/day over the Gardens of Stone</strong></p><p dir="ltr">The Emirates latest plans to fly helicopters over unique the Gardens of Stone State Conservation Area ruining the peace and quiet park visitors expect. We''ve included &nbsp;Emirates Wolgan Valley Resort helicopter proposal - <strong>Mod 4,</strong>&nbsp;<strong>MP06_0310</strong></p><p dir="ltr">&nbsp;</p><h2><a href="https://www.planningportal.nsw.gov.au/major-projects/projects/mod-4-temporary-changes-helicopter-transport" target="_blank">View Emirates resort modification report</a></h2><p>&nbsp;</p><h2 dir="ltr"><a href="/stop-helicopter-apocalypse" target="_blank">Some issues</a> with this proposal:</h2><ol><li data-list-item-id="e39eb47c558d14bae4710c7bebd195e99">The Proposal is Unnecessary as Wolgan Road is re-opening</li><li data-list-item-id="e6566dcbe2b68f6f53b7370f9bc77ad6a">Excessive Helicopter Flights&nbsp;</li><li data-list-item-id="ea7c3c5cb5c74dfee65a241e1493f23a2">Safety hazards</li><li data-list-item-id="e97c33cf8db8372042905a1a6fe775db1">Helicopter noise concentration in the lower Blue Mountains</li><li data-list-item-id="e7526b52c7e08e65576deb4d18f5be845">Impact on Public Investment and Tourism</li><li data-list-item-id="e90918678c95c961a53d55ce12eaaa5af">Flawed Noise Assessments</li><li data-list-item-id="e70fcb534f1d79f600e4b2849e715abf0">Environmental impacts disregarded</li><li data-list-item-id="ec2b6e4cca776826e01a27995f3572836">Lack of Trust and Accountability</li><li data-list-item-id="eddb6501eb661afabc4639f7556a0688f">The proposal is effectively a heliport and requires an EIS</li></ol><p dir="ltr"><strong>Object before 5pm, 19 May</strong>, if you have questions or need help to guide you through this process contact Keith Muir, email: <a href="http://mailto:keith.muir6@bigpond.com">keith.muir6@bigpond.com</a>&nbsp;</p><h3 dir="ltr">Making a submission</h3><p dir="ltr">Due to there being insufficient time to make a decent submission, a pre-filled form submission is provided. You can modify the submission text in the text box on the following pages. Alternatively, you may like to draft into a blank Word document and copy your answers across.&nbsp;</p><p dir="ltr">The Department does not count identical or substantially the same submissions as separate objections, so it much better to use the Planning Department''s website.&nbsp;</p><p dir="ltr">A submission consists of&nbsp;</p><ol dir="ltr"><li data-list-item-id="ecfad3ce465be7c7d56784c040cc940b8">Political donations declaration</li><li data-list-item-id="e74a35521a883255de30b0b993c95d02d">Personal details</li><li data-list-item-id="e1a590884ce6e9b6ebfb7b344b6cae55b">Declaration that this is an objection</li><li data-list-item-id="e56a4c03b03dad6d22d73fca442d8458b">Submission&nbsp;</li></ol>'
      view_the_issues_markup:
        '#type': webform_markup
        '#markup': '<h3 dir="ltr">A submission are best made directly via the <a href="https://www.planningportal.nsw.gov.au/major-projects/projects/mod-4-temporary-changes-helicopter-transport">NSW Government Major Projects Portal and click make a submission.</a></h3>'
  political_donations:
    '#type': webform_wizard_page
    '#title': 'Political Donations'
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
