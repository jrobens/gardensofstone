          <p dir="ltr">Start by introducing yourself and explaining why you care about this proposal.</p>

          <p dir="ltr">Could could describe your connection to the Gardens of Stone conservation area and any concerns you have about mining underneath in the reserve. Or you might want to include concerns that you may have for your health and that of your family due to the potential for water contamination.&nbsp;</p>

          <p dir="ltr">For example:&nbsp;</p>

          <p dir="ltr"><em>I have lived in the Lithgow area for 30 years and have travelled extensively throughout the Gardens of Stone conservation area. I feel a deep affinity with the natural beauty of the place. I wish that this beauty be appreciated by generations to come. I have witnessed first hand the damaged caused by previous mining operations. From swamps drying up to enormous cracks in rock formations. Each time I see these beautiful pagodas, streams, waterfalls and swamps damaged I feel as though I have been personally injured. I appreciate it when my children wonder at how the rock formations look like a particular bird, boat or boot and feel that it is very short sighted to damage these for a relatively minor short term profit.</em></p>
