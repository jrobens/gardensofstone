      '#markup': |-
        <p><span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif">The draft Master Plan for visitor management creates a parallel process to the draft Plan of Management. </span></span></span></p>

        <p><span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif">The visitor management details found in the Master Plan document have no legal force and so can be changed at the will of government. A Plan of Management is statutory and cannot be changed without public consultation. The Master Plan&rsquo;s list of intentions is more ambitious than the reserve&rsquo;s visitor management budget can fund, so it provides no clarity on which park facilities will be built.</span></span></span></p>
    masterplan_submission:
      '#type': textarea
      '#title': 'Masterplan Submission'
      '#rows': 40
      '#required': true
      '#default_value': |-
        The Manager
        NPWS Blue Mountains Branch
        P O Box 5225022
        Katoomba NSW 2780
        gardensofstonesca@environment.nsw.gov.au

        Dear Sir/Madam,

        Gardens of Stone SCA draft Master Plan

        I am delighted that the NSW Government has protected the Gardens of Stone but I believe a lot more work needs to be done to get reserve management right. The role of the draft Master Plan must be to identify through this public consultation a set of visitor management actions to be published in a completely revised draft Plan of Management.

        I support: 

        •	Nature-focused basic facilities like campgrounds, walking tracks, carparks and lookouts built on already disturbed land and serviced by good 2WD roads that everyone can use

        •	An emphasis on 2WD park roads accessible to all, including an upgraded Maiyingu Marrragu Road loop that associates Lithgow with visitor infrastructure, and with minor provision of 4WD trails where they can be managed sustainably and at low cost

        •	Aboriginal community involvement in reserve management, including through economic opportunities and employment 

        •	A significant reduction in past visitor use impacts though environmental restoration associated with the development of basic facilities

        •	Multi-day walking tracks with basic overnight camps set out to help inexperienced walkers improve their bush skills

        •	Development of criteria to permit public and transparent selection of appropriate park facilities that are compatible with the protection of heritage and scenery values at locations specified in the Plan of Management 

        •	Relocation of the adventure facilities hub to State Mine Gully to preserve the views at the iconic Lost City lookout and improve tourism opportunities for the State Mine Heritage Museum

        I oppose:

        •	Poorly defined Master Plan processes that seek to replace location-specific proposals for visitor facilities that should be enshrined in a plan of management 

        •	The proposed ziplines and via ferrata facilities and a Lost City 4WD access road that blight views from the iconic Lost City lookout

        •	Reserve entry by Old Bells Line of Road that by-passes Lithgow and goes past a large ugly quarry

        •	Exclusive 4WD vehicle access to iconic sites, such as Wolgan Falls and the Temple of Doom

        •	Built accommodation hubs, as NPWS reserves must be managed for nature, not for commercial interests who will take exclusive possession of reserve’s best attractions

        •	The long list of proposed visitor facilities in the Master Plan beyond the reserve’s budget, creating false expectations on what the NPWS can deliver

        •	Proposals to defer pine forest restoration for five years

        •	Location of visitor facilities in NPWS identified wilderness and at remote and scenic Mt McLean

        •	The Wollemi Great Walk being determined in secret by confidential contracts and leases negotiated for private ventures and extending beyond this reserve.

        Thank you for the opportunity to comment.

        Yours sincerely,
