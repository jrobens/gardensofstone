      '#help': 'Have your say on Centennial&rsquo;s latest plans to mine under unique wetlands and ancient rock formations - putting new areas of the Gardens of Stone conservation reserve at risk of damage. We&#39;ve included information below to help guide you through the process of making a submission on the Angus Place West.&nbsp;<strong>SSD-26254212</strong>'
