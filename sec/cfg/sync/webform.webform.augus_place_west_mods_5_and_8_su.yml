      '#display_on': form
      '#template': '[webform_submission:current-page:title]'
    markup_06:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr"><span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">We are concerned the modifications have not been referred for Commonwealth assessment under the EPBC Act. We think that this project is likely to have significant impacts on water and that the modifications should be referred to Environment Minister Plibersek to determine if the water trigger applies. Commonwealth assessment and the application of the water trigger is important to ensure that there is rigorous assessment of the surface and groundwater impacts of the modifications. </span></span></span></span></span><br />
        <br />
        Centennial Coal has failed to demonstrate that Modification 8 Angus Place and Modification 5 Western Coal Services do not impact of matters of national environmental significance. The modifications should be controlled actions under the Federal <em>Environmental Protection and Biodiversity Act </em>(EPBC Act) for the following reasons:</p>
        &bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">As &ldquo;large coal mining&rdquo; developments that will have, or are likely to have, &ldquo;a significant impact on a water resource&rdquo; the proposed modifications should be controlled actions under s 24D of the EPBC Act (known as the &ldquo;water trigger&rdquo;).</span></span></span></span><br />
        <br />
        &bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;These modifications will cause 10ML/day of mine water to be discharged into the Coxs River that flows downstream into the Greater Blue Mountains World Heritage Area. Any&nbsp;downstream impacts of mine water arising from the proposed modifications on World Heritage values of the World Heritage&nbsp;property must be considered.<br />
        <br />
        &bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Due to groundwater drawdown associated with the Angus Place modification 8 mine water pumping proposal, depressurisation between surface and the near-surface groundwater aquifers is possible, and could alter the existing groundwater and surface water regime. These modifications may also have a direct or indirect changes in the water resources of the Sydney Water catchment that must be considered. Far-field impacts on streams and swamps in the Angus Place West project area are possible and should be assessed.<br />
        <br />
        &bull;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Due to a probable lowering near-surface groundwater aquifers, Angus Place modification 8 may impact on nationally endangered species such as Swamp Everlasting, <em><span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">Grevillea acanthifolia</span></span></span></span></em><span style="font-size:11.0pt"><span style="line-height:107%"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">, <em>Gentianella cunninghamii</em>, <em>Prasophyllum australe,&nbsp;</em>Latham&#39;s Snipe </span></span></span></span>and nationally endangered Temperate Highland Peat Swamps on Sandstone in the Angus Place West Project Area. These impacts must be assessed.

        <p dir="ltr">The modifications are likely to impact on water resources of a drinking water catchment, a World Heritage Area and nationally endangered plants and communities. Modification 8 Angus Place and Modification 5 Western Coal Services should be controlled actions under the EPBC Act.</p>
    submission_long_term_impacts_economy:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Do you believe that the Angus Place and Western Coal Services modification proposals could impact of water resources, nationally endangered species and nationally endangered plant communities? Why would this happen and is it important?'
