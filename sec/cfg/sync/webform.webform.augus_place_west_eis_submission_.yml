      '#markup': |-
        <h3 dir="ltr"><strong>Step 1: Why are you making this submission?</strong></h3>

        <p dir="ltr">Start by introducing yourself and explaining why you care about this proposal.</p>

        <p dir="ltr">Could could describe your connection to the Gardens of Stone conservation area and any concerns you have about mining underneath in the reserve. Or you might want to include concerns that you may have for your health and that of your family due to the potential for water contamination.&nbsp;</p>

        <p dir="ltr">For example:&nbsp;</p>

        <p dir="ltr"><em>I am a retired nurse and grandmother. I am deeply concerned about the proposal to expand the mines underneath Lake Macquarie and what this means for community health. My grandson suffers from asthma and I worry that air pollution from the mines and burning the coal from the mines might contribute to his condition. As a former nurse, I also saw firsthand the shocking affect that asthma and other respiratory illnesses can have on patients and their families.&nbsp;</em>&nbsp;</p>

        <p dir="ltr"><em>I am a parent who enjoys taking my kids to the Lake on the weekends to go fishing. I am worried about what this project might mean for the health of the Lake and the beautiful environment we live in. My kids love to fish but I&rsquo;m concerned that this mining project will have a long term impact on the environment and their ability to fish well into the future.</em></p>

        <h3 dir="ltr"><strong>Step 2: Detail your concerns</strong></h3>

        <p dir="ltr">This is where you can raise your concerns with Centennial&rsquo;s Angus Place West proposal.&nbsp;</p>

        <p dir="ltr">There are a number of matters the decision maker must consider when assessing the Project, these include the &lsquo;likely impacts&rsquo; of the development, including the likely environmental impacts, social impacts and economic impacts of the development. In assessing the likely impacts, the Environmental Impact Statement (EIS) is required to consider and address key issues including water resources, biodiversity, subsidence and greenhouse gas emissions.</p>

        <p dir="ltr">The Gardens of Stone Alliance has identified the issues as follows in this form; you can raise one, some or all of these in your submission.&nbsp;</p>
