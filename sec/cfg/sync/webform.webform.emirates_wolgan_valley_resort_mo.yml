  part_2_introduce_yourself:
    '#type': webform_wizard_page
    '#title': 'Part 2: Introduce yourself, then share your concerns'
    markup_09:
      '#type': webform_markup
      '#markup': '<h3 dir="ltr"><strong>Step 1: Introduce yourself and why are you making this submission?</strong></h3><p dir="ltr">You can improve the form submission by introducing yourself and explaining why you care about this proposal.</p><p dir="ltr">You could describe your connection to the Gardens of Stone Conservation Area and any concerns you have about helicopter flights over the reserve. Or you might want to include concerns that you may have for your health and that of your family due to the potential for noise during the day. By adding such comments your submission is unique, but I doubt that the Planning Department would treat it that way if coming from an external webform...</p><p dir="ltr">Examples:&nbsp;</p><p dir="ltr"><em>I am a retired grandmother. I am deeply concerned about the proposal to expand helicopter flights to the Wolgan Resort and what this means for community health. I know quiet recreation in nature benefits our mental health.&nbsp;</em> <em>My grandson suffers from autism and I worry that helicopter noise will deny us the opportunity to find relief for his symptoms by camping in this park.&nbsp;</em></p><p dir="ltr"><em>I am a parent who enjoys taking my kids exploring in the Gardens of Stone region on the weekends. I am worried about what this project might mean four our enjoyment of this beautiful environment. My kids love to exploring in the Gardens of &nbsp;Stone but I’m concerned that the frequent helicopters flights will mean that not only my family but also the majority of visitors will stay away.</em></p>'
    submission:
      '#type': fieldset
      '#title': 'Submission as an objection'
      '#title_display': invisible
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      markup_introduce_yourself:
        '#type': webform_markup
        '#markup': '<p dir="ltr">Another example:&nbsp;</p><p dir="ltr"><em>I have visited the Gardens of Stone region for 30 years and have explored throughout this part of the World Heritage Area and State Conservation Area. I feel a deep affinity with the natural beauty of the place. I wish that this beauty be appreciated by generations to come. I have come to love its beautiful pagodas, streams, waterfalls and swamps. I appreciate it when my children wonder at how the rock formations look like a particular bird, boat or boot and feel that it is very short sighted to introduce helicopter noise and drive visitors away for all this natural wonder.</em></p><h2>Points you could raise (already inserted in this webform submission, but can be modified):</h2><p><strong>Proposal requires more scrutiny</strong></p><p><span style="-webkit-text-stroke-width:0px;color:black;font-family:Aptos, sans-serif;font-size:11pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:15.693334px;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" lang="EN-GB">The high number of helicopter flights and levels of impact on the sensitive park areas and community require Environmental Impact Statement processes. This proposal effectively would create a private heliport and should not be a modification as it is substantially different from the original proposal of just four helicopter flights a week.&nbsp;</span></p><p dir="ltr"><strong>Significant impacts on tourism</strong></p><p dir="ltr">I object to this proposal as it will shatter the peace with what would become effectively a private commercial heliport in one of Australia’s most spectacular regions. The Gardens of Stone are diverse landscape of globally significant geological heritage and significant plant diversity. Visitors to the area should not be driven away by noise. Imagine looking forward to hiking in one of Australia’s most spectacular regions, only to have the peace of your walk shattered by frequent helicopter noise.</p><p dir="ltr">This proposal could waste $50 million that the NSW Government has invested in visitor facilities.&nbsp;</p><p>Constant helicopter noise will degrade the peace and quiet park visitors expect, and could lead to a net economic loss for the region’s tourism industry, as the majority of park visitors won’t come to the Gardens of Stone once it has earnt a reputation for constant helicopter noise. The proposal does not even consider the impacts of helicopter noise on the Pagoda Walk, a public campground, Forest Camp, Birds Rock Lookout or Acoustic Canyon.</p><p>The controversial glamping resort proposals among pagoda landscapes are going to become “stranded assets,” as the Emirates’ Wolgan Resort already has permission for up to 10 helicopter flights a day. Nobody is going pay $1,000 a day to stay in a glamping resort and then put up with helicopter noise.&nbsp;</p><p><strong>The proposal is unnecessary</strong></p><p dir="ltr">Lithgow Council recently announced that Wolgan Road would be re-opened in August 2026. &nbsp;As the road is being re-opened the helicopter proposal lacks any justification. The resort justifies 210 helicopter flights per week by claiming the Wolgan Gap Road is closed. However, the road is scheduled to reopen to 2WD traffic by August 2026 (Lithgow Mercury, 7 May 2026).</p><p>If the road is safe enough for heavy truck logistics (linen, food, waste), it is safe enough for guests in 2WD vehicles.</p><p>This modification is likely to become permanent &nbsp;and the Emirates is unlikely to accept terminational of the consent modification once the Wolgan Road is re-opened.If the road is safe enough for heavy truck logistics (linen, food, waste), it is safe enough for guests in 2WD vehicles.</p><p><b style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;letter-spacing:normal;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="font-family:Aptos, sans-serif;font-size:11pt;line-height:15.693334px;" lang="EN-GB"><strong>Helicopter noise concentration in the lower Blue Mountains&nbsp;</strong></span></b></p><p>The proposal has not assessed the increase in helicopter noise caused by controlled airspace of Western Sydney International Airport. The rising terrain between Glenbrook and Springwood will force helicopters to fly at altitudes to avoid commercial flight paths.&nbsp;</p><p>I strongly object to helicopter noise of 30 daily movements being concentrated over lower Blue Mountains townships and the World Heritage National Park. This could significantly degrading the acoustic amenity of the lower Blue Mountains region.</p><p>Thank you for the opportunity to comment.</p>'
      i_am_objecting_to_the_proposal:
        '#type': radios
        '#title': 'I am objecting to the proposal'
        '#options': yes_no
        '#options_display': buttons_horizontal
        '#default_value': 'Yes'
      why_are_you_making_this_submission_:
        '#type': textarea
        '#title': 'Your submission'
        '#placeholder': |
          Start by introducing yourself and explaining why you care about this proposal.

          Describe your connection to the Gardens of Stone State Conservation Area and any concerns you have about helicopter flights over this reserve. 
        '#default_value': |-
          Mr. Jeffrey Peng
          NSW Department of Planning, Housing and Infrastructure


          Dear Mr Peng,

          Re: Emirates Wolgan Valley Resort - Mod 4, MP06_0310

          The increase in helicopter flights requires more scrutiny

          Please accept this submission as my objection to this proposal. Unfortunately the modification process does not provide enough time for me to write a detailed submission. I only recently heard about the proposed increases in helicopter flights. 

          The high number of helicopter flights and levels of impact on the sensitive park areas and community require Environmental Impact Statement processes. This proposal effectively would create a private heliport and should not be a modification as it is substantially different from the original proposal of just four helicopter flights a week. 

          Significant impacts on tourism

          I object to this proposal as it will shatter the peace with what would become effectively a private commercial heliport in one of Australia’s most spectacular regions. The Gardens of Stone are diverse landscape of globally significant geological heritage and significant plant diversity. Visitors to the area should not be driven away by noise. Imagine planning to hike in this area, one of Australia’s most spectacular regions, only to then have the peace shattered by frequent helicopter noise during your walk.

          This proposal could waste $50 million that the NSW Government has invested in visitor facilities. 

          Constant helicopter noise will degrade the peace and quiet park visitors expect, and could lead to a net economic loss for the region’s tourism industry, as the majority of park visitors won’t come to the Gardens of Stone once it has earnt a reputation for constant helicopter noise. The proposal does not even consider the impacts of helicopter noise on the Pagoda Walk, a public campground, Forest Camp, Birds Rock Lookout or Acoustic Canyon.

          The controversial glamping resort proposals among pagoda landscapes are going to become “stranded assets,” as the Emirates’ Wolgan Resort already has permission for up to 10 helicopter flights a day. Nobody is going pay $1,000 a day to stay in a glamping resort and then put up with helicopter noise. 

          The proposal is unnecessary

          Lithgow Council recently announced that Wolgan Road would be re-opened in August 2026.  As the road is being re-opened the helicopter proposal lacks any justification. The resort justifies 210 helicopter flights per week by claiming the Wolgan Gap Road is closed. However, the road is scheduled to reopen to 2WD traffic by August 2026 (Lithgow Mercury, 7 May 2026).

          If the road is safe enough for heavy truck logistics (linen, food, waste), it is safe enough for guests in 2WD vehicles.

          This modification is likely to become permanent  and the Emirates is unlikely to accept terminational of the consent modification once the Wolgan Road is re-opened.If the road is safe enough for heavy truck logistics (linen, food, waste), it is safe enough for guests in 2WD vehicles.

          Helicopter noise concentration in the lower Blue Mountains 

          The proposal has not assessed the increase in helicopter noise caused by controlled airspace of Western Sydney International Airport. The rising terrain between Glenbrook and Springwood will force helicopters to fly at altitudes to avoid commercial flight paths. 

          I strongly object to helicopter noise of 30 daily movements being concentrated over lower Blue Mountains townships and the World Heritage National Park. This could significantly degrading the acoustic amenity of the lower Blue Mountains region.

          Thank you for the opportunity to comment.
