id: objection_to_leases_in_the_garde
title: 'Objection to leases in the Gardens of Stone SCA'
description: 'Submission regarding the commercial leases over the Gardens of Stone State Conservation Area'
categories: {  }
elements: |-
  plan_of_management:
    '#type': webform_wizard_page
    '#title': 'Submission on lease developments'
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
