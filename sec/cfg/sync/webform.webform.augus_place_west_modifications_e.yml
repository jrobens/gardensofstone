id: augus_place_west_modifications_e
title: 'Augus Place West - Modifications – email action'
description: 'Representations to Minister Paul Scully regarding Centennial Coal mine modifications&nbsp;'
categories: {  }
elements: |-
  plan_of_management:
    '#type': webform_wizard_page
    '#title': 'Protect Sydney’s drinking water from coal mine waste '
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
    markup:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p><strong>Angus Place Colliery mine plans</strong><br />
        <br />
        Centennial Coal proposes to discharge of millions of litres of contaminated water into a stream that feeds Sydney&rsquo;s main drinking water source. This proposed discharge would by-passes the purpose-built water treatment plant that is supposed to treat all of Centennial&#39;s mine water.<br />
        <br />
        It&rsquo;s part of the company&rsquo;s broader plan to expand its Angus Place coal mine &ndash; beneath the protected Gardens of Stone State Conservation Area.&nbsp;<br />
        <br />
        Plans like these pose serious threats to community health, to water, and to our environment &ndash; so they must be thoroughly scrutinised.&nbsp;<br />
        <br />
        That&rsquo;s why we&rsquo;re calling for our NSW Planning Minister, Paul Scully, to refer these plans to Federal Environment Minister Tanya Plibersek.&nbsp;By taking action you help ensure there will be an independent review of these coal mine proposals that could damage nationally significant water and conservation values.<br />
        <br />
        Please use the form below to send a quick email to Minister Scully:&nbsp;</p>
    submission:
      '#type': fieldset
      '#title': 'Letter to Planning Minister Paul Scully'
      '#title_display': invisible
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      plan_of_management_submission:
        '#type': textarea
        '#title': 'Letter to Planning Minister Paul Scully'
        '#rows': 40
        '#required': true
        '#default_value': |-
          The Hon Paul Scully
          Minister for Planning and Public Spaces
          GPO Box 5341
          SYDNEY NSW 2001


          Dear Minister Scully,

          I am concerned about the threats to community health and our environment posed by Centennial Coal’s plans to modify the existing consents for Angus Place coal mine (MP06_0021-Mod-8) and the Western Coal Services site (SSD-5579-Mod-5).

          These plans propose discharging 10 million litres of contaminated mine water per day into Wangcol Creek, which flows to the Coxs River, and is part of the Sydney Drinking Water Catchment. These proposals would by-pass the purpose-built water treatment plant that can treat up to 42 million litres a day of contraminated mine water before reuse.

          I am deeply concerned about these projects for a number of reasons.

          The discharge water will be contaminated with toxic chemicals like arsenic, selenium, ammonia and fluoride, as well as other heavy metals. This water will flow into waterways and will cause likely harm to aquatic ecosystems before it ends up in Sydney’s drinking water supply at Warragamba Dam – which is relied on by hundreds of thousands of people for clean, safe, unpolluted water. 

          Additionally, pumping millions of litres of water from Angus Place mine is underneath the Gardens of Stone State Conservation Area – home to incredible ancient "pagoda" rock formations, ecological communities, cultural heritage, and countless threatened plants and animals. The proposed pumping may impact on near-surface groundwater availability and precious wetlands that are sensitive to changes in the surface watertable. The Gardens of Stone region is a globally-recognised area and its remaining wetlands must be protected.

          Minister Scully, you have a duty to ensure robust processes for these proposals. This includes ensuring that the requirements of the Bilateral Agreement between NSW and the Commonwealth on matters of national environmental significance are met, and to facilitate referral of proposals that may impact on these important heritage matters.

          That’s why I am requesting you refer these Centennial Coal plans for assessment under our federal Environment Protection and Biodiversity Conservation Act. Due to Centennial’s plans being integral to coal mining and that significant impacts on water resources are likely, the ‘water trigger’ applies and the plans must be assessed under the EPBC Act. 

          Clean water is vital for life. It is essential to the health of our communities and our environment. 

          I believe that the potential for nationally endangered swamps and plants to be impacted in these mine water pumping, transfer and disposal proposals should also be referred for assessment under the EPBC Act.

          Minister, I am asking you to recognise this and act to ensure these projects receive the highest possible scrutiny and inefficient, inconsistent assessment of these projects is avoided.

          Yours sincerely,
