    markup:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p>Thank you to all who made submissions on National Parks and Wildlife Service <a href="https://www.environment.nsw.gov.au/topics/parks-reserves-and-protected-areas/park-management/community-engagement/walking-tracks-and-trails-in-national-parks/gardens-of-stone-state-conservation-area/gardens-of-stone-state-conservation-area-draft-plan-of-management">proposals to manage the Gardens of Stone State Conservation Area</a>.&nbsp;We are seeking to fix the vague draft plan of management for the reserve and the accompanying draft Master Plan for visitor management creates a parallel process with no legal force under the National Parks and Wildlife Act, 1974.<br />
        &nbsp;</p>

        <p>Except for pest management strategies, the draft plan of management has few details on nature conservation action. There are no restoration management actions, apart from studies, to spend the very large biodiversity offset fund available for this work.<br />
        &nbsp;</p>

        <p>The draft plan proposes a Lost City adventure activity precinct and up to four accommodation nodes are a real concern. It is even more worrying that what is actually proposed to be built will be decided through commercial-in-confidence lease negotiations, that are not subject to transparent and open public consultation processes. This is the public&#39;s reserve, and we can&#39;t let secret deals risk make a mess of what should become a really great new park.</p>
    submission:
      '#type': fieldset
      '#title': Submission
      '#title_display': invisible
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      plan_of_management_submission:
        '#type': textarea
        '#title': 'Plan of Management Submission'
        '#rows': 40
        '#required': true
        '#default_value': |-
          The Manager
          Planning and Assessment
          NPWS Locked Bag 5022
          Parramatta NSW 2124
          npws.parkplanning@environment.nsw.gov.au


          Dear Sir/Madam, 

                  The Gardens of Stone SCA draft plan of management

          I am delighted that the NSW Government has protected the Gardens of Stone but the draft plan of management is unworkable and needs to be revised, and then re-exhibited. The revised plan must define the location and extent of proposed visitor facilities and access, with criteria set out that ensure this work is done in a sustainable manner.

          I support:

          •	Nature-focused basic visitor facilities of campgrounds, walking tracks, carparks and lookouts constructed on already disturbed land and serviced by good 2WD roads that everyone can use

          •	Rehabilitation of the former pine forest with endemic native species to restore natural environments

          •	Traditional Owners' wishes to care for and share Country and Aboriginal culture

          •	An emphasis on 2WD park roads accessible to all, with minor provision of 4WD trails where they can be managed sustainably and at low cost as defined on the plan’s map through broad consultation

          •	The prohibition on riding motorised trail bikes off road

          •	Multi-day walking tracks with basic overnight campsites to assist inexperienced walkers improve their bush skills

          •	Relocation of the adventure tourism activity hub to State Mine gully to protect the iconic Lost City from visual blight and encourage visitation to the State Mine and Railway Museum.

          I oppose:

          •	The vague framework of strategic intentions in this open-ended 'plan for a plan'

          •	The absence of environmental restoration actions, despite the significant biodiversity offset funds available for this work

          •	Processes that permit additional approved access routes for vehicles, horse and bike riders through private consultations with the groups who want it, instead of defining access on the plan of management map

          •	Tourism growth as a reserve management objective is inappropriate. Management that restores, protects and presents the reserve’s outstanding heritage values will deliver better outcomes 

          •	The proposed ziplines and via ferrata facilities that blight views of the iconic Lost City and up to four glamping accommodation hubs that are subject to secret lease negotiations

          •	Carbon storage ‘investment’ that is not a by-product of restoring natural woodlands to create ‘tree farms’ and that requires changes to the National Parks and Wildlife Act.

          Thank you for the opportunity to comment.
        '#access_create_roles':
          - authenticated
        '#access_update_roles':
          - authenticated
          - anonymous
        '#access_view_roles':
          - authenticated
          - anonymous
  masterplan:
    '#type': webform_wizard_page
    '#title': Masterplan
    '#access_create_roles':
