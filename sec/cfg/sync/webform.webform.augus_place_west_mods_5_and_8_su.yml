    markup_04:
      '#type': webform_markup
      '#access_create_roles':
        - authenticated
        - anonymous
      '#access_update_roles':
        - authenticated
        - anonymous
      '#access_view_roles':
        - authenticated
        - anonymous
      '#markup': |-
        <p dir="ltr"><span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">Modification 8 for Angus Place and modification 5 for Western Coal Services appear to be part of Centennial&rsquo;s plans to expand mining under Angus Place West &ndash; which has to go through a state significant development application.</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">The executive summary of the report for these modifications makes their connection to Centennial&rsquo;s expansion plans clear when it concludes that, &ldquo;The proposed modification will &hellip; safeguard the feasible recovery of the coal resource remaining at the mine.&rdquo;</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">The impacts of these modifications should be assessed in totality with the proposed Angus Place West mine expansion, rather than piecemeal through these modifications.</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">If approved, these modifications could also obscure the extent of impacts from the future Angus Place West proposal on national heritage in the new Gardens of Stone reserve. Modifications are supposed to allow for minor changes to approved major projects. These modifications could damage nationally endangered swamps and plants and drain water from streams in the new Gardens of Stone State Conservation Area. These modification proposals also propose to by-pass the $120 million reverse osmosis mine water treatment plant and recommence the discharge of mine water into the Coxs River catchment. These changes are not minor matters.</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">By carving out these changes as modification requests, it seems that Centennial Coal is trying to get around the purposes of the <em>Environmental Planning and Assessment Act, 1979</em>.</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">The impacts of these modifications should be assessed in totality with Angus Place West major project, rather than piecemeal through these modifications.</span></span></span></span></span><br />
        <br />
        <span style="font-size:12pt"><span style="background:white"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Calibri&quot;,sans-serif"><span style="color:#1b1b1b">The modifications should be withdrawn and the proposed changes should be included in Centennial&rsquo;s state significant development application for the Angus Place West mining area so that they can be appropriately assessed.</span></span></span></span></span></p>
    submission_first_nations_rock_art:
      '#type': textarea
      '#title': Submission
      '#placeholder': 'Do you think the modifications should be part of the Angus Place West proposal or do you think this modification processes are adequate for these mine proposals?'
