id: gardens_of_stone_draft_plan_of_m
title: 'Gardens of Stone draft Plan of Management — will it be wonderland or a theme park?'
description: 'Plan of management submission'
categories: {  }
elements: |-
  plan_of_management:
    '#type': webform_wizard_page
    '#title': 'Plan of Management'
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
