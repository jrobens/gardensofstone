id: test_object_to_glamping_resorts
title: 'TEST Object to Glamping Resorts in the Gardens of Stone'
description: '<p>Submission regarding the NPWS draft Review of Environmental Factors for three glamping resorts the Gardens of Stone State Conservation Area (the proposed activity).</p>'
categories: {  }
elements: |-
  plan_of_management:
    '#type': webform_wizard_page
    '#title': 'Object now to three commercial resorts planned in pagoda landscapes'
  markup:
    '#type': webform_markup
    '#markup': '<p><strong>Three glamping resorts are proposed in the pagodas landscapes of the Gardens of Stone State Conservation Area - object now</strong><br><br><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">The NSW National Parks and Wildlife Service (NPWS) has on exhibition for comment a draft Review of Environmental Factors (draft REF) for exclusive glamping accommodation located among pagoda landforms, that will cause significant visual blight. This </span><a href="/files/page/2026-02/Resort%20Issues.pdf"><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">slideshow graphically reveals</span></a><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;"> what''s at stake with this resort proposal, check it out.</span></p><p><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;"><strong>The three resort proposals are being advertised for public comment until 5pm Thursday February 26 so don''t delay, write a submission now</strong>.&nbsp;</span><br><br><a href="https://www.gardensofstone.org.au/campaigning-guide-stop-pagoda-resort-development#resort-sub-guide"><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">Please make unique individual submission</span></a><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">, rather than to use this webform. To assist you, </span><a href="https://www.gardensofstone.org.au/campaigning-guide-stop-pagoda-resort-development#resort-sub-guide"><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">access this dot guide</span></a><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;"> that provides suggestions regarding the scope of the disturbing issues that are associated with this NPWS resort proposal for private commercial development.</span><br><br><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">The glamping resort proposal creates an appalling precedent for national parks of the NPWS advancing development blight in internationally significant platy pagoda landscapes that should be protected in this "national park in waiting".</span></p><p><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">Please make an objection by either going to the </span><a href="https://www.environment.nsw.gov.au/topics/parks-reserves-and-protected-areas/park-management/community-engagement/walking-tracks-and-trails-in-national-parks/gardens-of-stone-state-conservation-area/bush-camps-draft-review-environmental-factors-consultation"><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;">NSW Government''s comments page</span></a><span style="font-family:Calibri,sans-serif;font-size:11pt;line-height:107%;"> or you can modify this guide submission in the webform below to make a quick submission from here:</span></p>'
  submission:
    '#type': fieldset
    '#title': 'Objection to the granting of cabin leases among pagodas in the Gardens of Stone '
    '#title_display': invisible
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
  plan_of_management_submission:
    '#type': textarea
    '#title': 'Objection to resorts development among platy pagodas'
    '#rows': 40
    '#required': true
    '#default_value': |-
      Gardens of Stone State Conservation Area Project Team
      PO Box 552
      Katoomba NSW 2780

      To whom it may concern,

      Re: Objection to Glamping Resorts in rare pagoda landscapes

      I am writing to formally object to the proposed glamping resorts (bush camps) within the Gardens of Stone State Conservation Area for the following reasons:

      1. Environmental and Landscape Impact
      Visual pollution: Placing commercial structures in undisturbed pagoda landscapes degrades the visual amenity of this geodiversity that the NPWS has a duty to preserve.

      Irreplaceable Heritage: These resorts will permanently degrade these rare, internationally significant "platy pagoda" landscapes that this national park in waiting was specifically created to protect.

      Physical Incompatibility: The requirement to build 60m² foreign soil mounds for waste disposal on top of sandstone rockplates proves these sites are physically and ecologically unsuitable for the proposed accommodation infrastructure.

      2. Flawed Assessment (REF)

      Misleading Claims: The draft REF incorrectly labels these pristine sites as "degraded" to justify development. This is a fundamental misrepresentation of the actual condition of both the resort sites and the specific locality in which they are placed.

      Manipulated Definitions: I object to the NPWS narrowly defining pagoda landscapes to exclude sandstone rockplate buffers, which ignores the reality of the pagoda shrubland ecosystem in which the pagodas sit.

      3. Public Equity and Integrity

      Wealth vs. Access: This proposal replaces a so-called "fitness barrier" (the ability to walk) with a "wealth barrier" (the ability to pay for luxury stays). These outstanding landscapes of natural beauty should be protected for the general public, not commodified for a few.

      Conflict of Interest: The NPWS is acting as both the proponent and the decision-maker. These specific duties compromise the core NPWS conservation responsibilities for commercial gain and is a breach of public trust.

      Lack of Transparency: The leasing process has allowed these rare landscapes to be traded between corporations like speculative real estate without adequate public scrutiny.

      Conclusion: I urge the NPWS to reject these three glamping proposals. The integrity of rare platy pagoda landscapes in the Gardens of Stone SCA requires rejection of these inappropriate located commercial resort proposals. The 60m² soil mound on a rock plate highlights how clumsy the engineering is for such a delicate area.

      Yours sincerely, 
  name_and_address:
    '#type': webform_wizard_page
    '#title': 'Name and Address'
    '#access_create_roles':
      - authenticated
      - anonymous
    '#access_update_roles':
      - authenticated
      - anonymous
    '#access_view_roles':
      - authenticated
      - anonymous
  captcha:
    '#type': captcha
